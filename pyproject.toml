[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-mogestpy"
version = "0.1.0"
requires-python = ">=3.11,<4.0"

dependencies = [
    "mogestpy>=2.1.0",
    "streamlit>=1.52",
    "pandas>=2.2",
    "plotly>=5.24",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "pyflwdir>=0.5.12",
    # pyflwdir 0.5.12 hands Affine to numba; affine 3 is no longer a namedtuple
    "affine>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["-m", "not slow"]
markers = ["slow: reads the Copernicus GLO-30 or NASA POWER over the network (run with -m slow)"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Copied from mogest-network (black, 100 columns): keep the diff to the source small
"core/mogest_network/*" = ["E501", "I001"]

[tool.poetry]
package-mode = false
